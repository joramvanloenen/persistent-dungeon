<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Fringe · Landing traffic</title><style>
:root{font:14px/1.5 system-ui;color:#d7e4df;background:#101e26}body{max-width:1180px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:22px;margin:0}a{color:#80c7bd}p{color:#9dafad}.controls{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}select,button{font:inherit;background:#20343e;color:#d7e4df;border:1px solid #58747a;min-height:44px;padding:8px}label{display:flex;gap:8px;align-items:center}main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}canvas{width:100%;display:block;background:#718c79}aside{border-left:1px solid #41606a;padding-left:20px}h2{font-size:19px;margin:0}small{color:#83bfb6;text-transform:uppercase;letter-spacing:1px}#activity{font-size:18px;color:#d7e4df}#memory p{font-size:12px;border-top:1px solid #304852;padding-top:8px}.caption{font-size:12px}@media(max-width:760px){body{padding:12px}main{grid-template-columns:1fr}aside{border-left:0;padding:0}h1{font-size:19px}}
</style></head><body><header><h1>THE FRINGE / ARRIVALS</h1><a href="../">Return to game</a></header><p>Working ship traffic, pilot routes, and remembered visits from the game code.</p><div class="controls"><label>Visit <select id="mission"><option value="supplies">Buy supplies</option><option value="bar">Visit the hull bar</option><option value="meeting">Meet the port broker</option></select></label><label>Phase <select id="phase"><option value="landing">Landing</option><option value="disembarking">Exit ship</option><option value="walking" selected>Walk into town</option><option value="objective">Business in town</option><option value="lodging">Crew pod stay</option><option value="boarding">Board ship</option><option value="takeoff">Launch</option></select></label><label>Speed <select id="speed"><option value="0">Paused</option><option value="1">Real time</option><option value="4" selected>4×</option><option value="12">12×</option></select></label><button id="talk">Speak with pilot</button></div><main><section><canvas id="port" width="780" height="600" aria-label="Ships arrive and a Drifter follows their objective through the colony"></canvas><p class="caption">Actual low-poly game meshes projected in Canvas; lighting is approximated. Preview saves are separate from your game.</p></section><aside><small id="status">LANDING BAY</small><h2 id="name"></h2><p id="ship"></p><p id="activity"></p><p id="next"></p><p id="reply"></p><small>REMEMBERED VISITS</small><div id="memory"></div></aside></main>
<script type="module">
import * as T from '../vendor/three.module.js';
import {settlement} from '../src/world.js?v=11';
import {villageHouses} from '../src/scene-layout.js?v=25';
import {shipVisitor,portBroker} from '../src/landing-port.js?v=25';
import {npcAt,portShipAt,advanceNpcLife,meetNpc,WORLD_EPOCH} from '../src/npc-life.js?v=25';
import {buildSkiff,updateSkiff,buildLandingBay,buildPortFacilities} from '../src/port-render.js?v=25';
import {salvageHut} from '../src/salvage-huts.js?v=12';
import {avatar} from '../src/render.js?v=25';
const s=settlement(0,0),pilot=shipVisitor(s),broker=portBroker(s),canvas=document.querySelector('#port'),ctx=canvas.getContext('2d'),scene=new T.Group(),ship=buildSkiff(1),person=avatar(0xbd9578),agent=avatar(0x728e9e),houses=villageHouses(s),floor=new T.Mesh(new T.BoxGeometry(100,.05,95),new T.MeshStandardMaterial({color:0x718c79}));floor.position.set(s.x,s.y-.06,s.z);scene.add(floor,buildLandingBay(s),buildPortFacilities(s,houses),ship,person,agent);
for(const [i,h]of houses.entries()){const hut=salvageHut(h.width,h.depth,i);hut.position.set(h.x,s.y,h.z);hut.rotation.y=h.rotation;scene.add(hut);}
const camera=new T.PerspectiveCamera(43,780/600,.1,500),focus=new T.Vector3(s.x,s.y,s.z+8);camera.position.copy(focus).add(new T.Vector3(40,65,75));camera.lookAt(focus);camera.updateMatrixWorld();const light=new T.Vector3(-.4,.9,.25).normalize();let life=JSON.parse(localStorage.getItem('fringe-port-preview-memory')||'{}'),time=WORLD_EPOCH,last=performance.now(),lastDraw=0;
function seek(){const phase=document.querySelector('#phase').value,objective=document.querySelector('#mission').value;for(let t=0;t<2500000;t+=300){const at=npcAt(pilot,WORLD_EPOCH+t);if(at.phase===phase&&at.objective===objective&&at.phaseProgress>.35&&at.phaseProgress<.75){time=WORLD_EPOCH+t;life={};document.querySelector('#reply').textContent='';return;}}}
document.querySelector('#phase').onchange=document.querySelector('#mission').onchange=seek;
document.querySelector('#talk').onclick=()=>{const at=npcAt(pilot,time,life[pilot.id]);if(at.available===false){document.querySelector('#reply').textContent='The pilot is inside or in flight. Catch them outside.';return;}life[pilot.id]=meetNpc(pilot,life[pilot.id]||{},time);document.querySelector('#reply').textContent=`“Give me a minute. ${pilot.shipName} can wait.” Conversation pauses the pilot and their departure.`;};seek();
function render(){const at=npcAt(pilot,time,life[pilot.id]),state=portShipAt(s,time,life);life[pilot.id]=advanceNpcLife(pilot,life[pilot.id],time);localStorage.setItem('fringe-port-preview-memory',JSON.stringify(life));updateSkiff(ship,state);person.visible=at.available;person.position.set(at.x,at.y,at.z);person.rotation.y=at.heading;agent.position.set(broker.x,broker.y,broker.z);agent.rotation.y=Math.PI/2;scene.updateMatrixWorld(true);
 const pixels=ctx.createImageData(780,600),depth=new Float32Array(780*600);depth.fill(Infinity);for(let i=0;i<pixels.data.length;i+=4){pixels.data[i]=131;pixels.data[i+1]=158;pixels.data[i+2]=147;pixels.data[i+3]=255;}
 const faces=[];scene.traverse(o=>{if(!o.isMesh)return;let p=o;while(p){if(!p.visible)return;p=p.parent;}const pos=o.geometry.attributes.position,index=o.geometry.index,count=index?index.count:pos.count;for(let i=0;i<count;i+=3){const v=[0,1,2].map(j=>new T.Vector3().fromBufferAttribute(pos,index?index.getX(i+j):i+j).applyMatrix4(o.matrixWorld)),normal=new T.Vector3().crossVectors(v[1].clone().sub(v[0]),v[2].clone().sub(v[0])).normalize(),color=o.material.color.clone().multiplyScalar(.5+.5*Math.max(0,normal.dot(light))).convertLinearToSRGB(),coords=v.map(p=>{p.project(camera);return {x:(p.x*.5+.5)*780,y:(-p.y*.5+.5)*600,z:p.z};});if(coords.some(p=>p.z<0||p.z>1))continue;faces.push({coords,rgb:[color.r*255,color.g*255,color.b*255]});}});
 for(const {coords:[a,b,c],rgb}of faces){const area=(b.y-c.y)*(a.x-c.x)+(c.x-b.x)*(a.y-c.y);if(Math.abs(area)<.000001)continue;const x0=Math.max(0,Math.floor(Math.min(a.x,b.x,c.x))),x1=Math.min(779,Math.ceil(Math.max(a.x,b.x,c.x))),y0=Math.max(0,Math.floor(Math.min(a.y,b.y,c.y))),y1=Math.min(599,Math.ceil(Math.max(a.y,b.y,c.y)));for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const u=((b.y-c.y)*(x+.5-c.x)+(c.x-b.x)*(y+.5-c.y))/area,v=((c.y-a.y)*(x+.5-c.x)+(a.x-c.x)*(y+.5-c.y))/area,w=1-u-v;if(u<0||v<0||w<0)continue;const z=u*a.z+v*b.z+w*c.z,offset=y*780+x;if(z>=depth[offset])continue;depth[offset]=z;const i=offset*4;pixels.data[i]=rgb[0];pixels.data[i+1]=rgb[1];pixels.data[i+2]=rgb[2];}}
 ctx.putImageData(pixels,0,0);for(const [text,x,z]of [['SUPPLIES',s.x+18,s.z+7],['HULL BAR',houses[2].x,houses[2].z],['CREW PODS',houses[5].x,houses[5].z],['BAY 01',s.x,s.z+20]]){const v=new T.Vector3(x,s.y+7,z).project(camera);ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#152c34';ctx.fillText(text,(v.x*.5+.5)*780,(-v.y*.5+.5)*600);}
 document.querySelector('#status').textContent=`BAY 01 / ${state.phase.toUpperCase()}`;document.querySelector('#name').textContent=pilot.name;document.querySelector('#ship').textContent=`${pilot.shipName} · ${pilot.affiliation}`;document.querySelector('#activity').textContent=at.activity;document.querySelector('#next').textContent=at.stay?'After the objective: crew pod rest, then board and depart.':'After the objective: return to the skiff and depart.';document.querySelector('#memory').replaceChildren(...life[pilot.id].observations.slice(-5).reverse().map(o=>{const p=document.createElement('p');p.textContent=o.summary;return p;}));document.querySelector('#talk').disabled=!at.available;
}
function tick(now){time+=(now-last)*Number(document.querySelector('#speed').value);last=now;if(now-lastDraw>180){lastDraw=now;render();}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
