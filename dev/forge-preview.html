<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Fringe · forge playtest</title><link rel="stylesheet" href="../style.css?v=11"><style>body{overflow:auto;padding:12px;background:var(--field)}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}header strong{margin-right:auto}header button,select{min-height:44px}iframe{display:block;width:520px;max-width:100%;height:760px;box-sizing:content-box;border:1px solid var(--line);margin:auto}p{font-size:12px}</style></head><body>
<header><strong>Fabrication playtest · disposable fixture</strong><button id="reopen">Open fabricator</button><button id="advance">Advance heat by 7 seconds</button><select id="size" aria-label="Preview width"><option value="520">Desktop</option><option value="390">Phone 390</option><option value="320">Phone 320</option></select></header><iframe id="forge-preview" title="Forge interface preview"></iframe><p>Uses the real crafting rules and UI with an in-memory traveler. No saves are changed. The advance button skips heating time for testing; strike timers still run normally.</p><output id="result" aria-live="polite"></output>
<script type="module">
import {createPlayer,validateAction} from '../src/rules.js?v=25';
import {settlement,smithFor} from '../src/world.js?v=11';
import {installForgeUI} from '../src/forge-ui.js?v=11';
import {installUILayout} from '../src/ui-layout.js?v=4';
const frame=document.getElementById('forge-preview'),source=await(await fetch('../index.html?v=11')).text(),doc=new DOMParser().parseFromString(source,'text/html');doc.querySelectorAll('script').forEach(e=>e.remove());const base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);doc.getElementById('loading').hidden=true;frame.srcdoc=doc.documentElement.outerHTML;await new Promise(resolve=>frame.onload=resolve);
const ui=frame.contentDocument,smith=Array.from({length:20},(_,i)=>smithFor(settlement(i-10,0))).find(Boolean);let p=createPlayer('forge-preview','Ada'),skip=0;p.x=smith.x;p.z=smith.z;p.coins=40;p.inventory.iron=20;p.inventory.wood=20;const clock=()=>Date.now()+skip;
installUILayout(ui,frame.contentWindow);const forge=installForgeUI({doc:ui,getPlayer:()=>p,clock,act:async a=>{const r=validateAction(p,a,{now:clock()});p=r.player;document.getElementById('result').textContent=r.summary+' · '+p.coins+' credits · '+p.weapons.length+' weapons';return r;},openDialog:id=>ui.getElementById(id).showModal(),onTalk:()=>{document.getElementById('result').textContent='Fabricator conversation uses the normal NPC memory system in the game.';}});forge.open(smith);document.getElementById('advance').onclick=()=>{skip=p.forge?.phase==='heat'?p.forge.startedAt+7000-Date.now():skip+7000;forge.refresh();};document.getElementById('reopen').onclick=()=>{if(!ui.getElementById('forge-dialog').open)forge.open(smith);};document.getElementById('size').onchange=e=>{frame.style.width=e.target.value+'px';};
</script></body></html>
