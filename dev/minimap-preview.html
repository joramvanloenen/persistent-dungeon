<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Evermere · minimap camera alignment</title>
 <link rel="stylesheet" href="../style.css?v=11">
 <style>body{overflow:auto;padding:24px;margin:0}main{max-width:540px;margin:auto}h1{font-size:22px}p{font-size:13px;line-height:1.6;color:var(--muted)}label{display:flex;align-items:center;gap:12px;margin:20px 0}select{min-height:44px;padding:8px}.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}figure{margin:0;padding:12px;background:var(--field);border:1px solid var(--line)}canvas{display:block;width:100%;aspect-ratio:1}figcaption{font-size:12px;margin-top:10px}h2{font-size:14px;margin:0 0 12px}output{display:block;margin:18px 0;font-size:13px;color:var(--teal)}</style>
</head>
<body><main>
 <h1>Minimap camera alignment</h1>
 <p>Preview fixtures. The top of the camera map follows your view. The traveler stays centered; N points toward north.</p>
 <label>Camera direction <select id="direction" aria-label="Camera direction"><option value="0">North</option><option value="45">Northwest</option><option value="90">West</option><option value="180">South</option><option value="270">East</option></select></label>
 <div class="maps">
  <div><h2>Reference · north up</h2><figure><canvas id="surface-reference" width="190" height="190"></canvas><figcaption>Surface</figcaption></figure></div>
  <div><h2>Camera view</h2><figure><canvas id="surface-camera" width="190" height="190"></canvas><figcaption>Surface</figcaption></figure></div>
  <figure><canvas id="cave-reference" width="190" height="190"></canvas><figcaption>Dungeon · north up</figcaption></figure>
  <figure><canvas id="cave-camera" width="190" height="190"></canvas><figcaption>Dungeon · camera view</figcaption></figure>
 </div><output id="bearing" aria-live="polite"></output>
 <p>This preview uses the game’s minimap renderer and does not change a traveler save.</p>
</main><script type="module">
 import {drawMiniMap} from '../src/map.js?v=11';
 import {createPlayer} from '../src/rules.js?v=24';
 import {generateDungeon} from '../src/dungeons.js?v=11';
 const p=createPlayer('minimap-preview','Ada'),cave=generateDungeon(-2,3),underground={...p,dungeon:{id:cave.id,...cave.spawn}},$=id=>document.getElementById(id);
 drawMiniMap($('surface-reference'),p,{heading:Math.PI});drawMiniMap($('cave-reference'),underground,{cave,heading:Math.PI});
 function redraw(){const cameraYaw=Number($('direction').value)*Math.PI/180;drawMiniMap($('surface-camera'),p,{heading:Math.PI,cameraYaw});drawMiniMap($('cave-camera'),underground,{cave,heading:Math.PI,cameraYaw});$('bearing').textContent='Camera forward: '+$('direction').selectedOptions[0].textContent+' · terrain and north marker follow the camera.';}
 $('direction').onchange=redraw;redraw();
</script></body></html>
