<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Fringe · Salvage hut models</title><style>
:root{font:15px/1.4 system-ui,Arial,sans-serif;color:#dce7e7;background:#172c35}body{margin:0;padding:18px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}h1{font-size:19px;margin:0 20px 0 0}button{font:inherit;border:1px solid #799199;background:#344c57;color:inherit;padding:10px 16px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#bd9862;color:#172c35}.frame{max-width:900px;margin:auto;border:1px solid #688087;background:#859791}canvas{display:block;width:100%}.caption{max-width:900px;margin:8px auto;font-size:13px;color:#b7caca}
</style></head><body><header><h1>Drifter shelter models</h1><button data-style="0" aria-pressed="true">Freighter booster</button><button data-style="1">Escape stage</button><button data-style="2">Cargo capsule</button><button data-style="3">Your landing pod</button></header><div class="frame"><canvas width="900" height="640" aria-label="Projected model of the selected salvage shelter"></canvas></div><p class="caption">Development model preview projected from the same Three.js mesh geometry used in the world. This view does not use WebGL.</p>
<script type="module">
import * as T from '../vendor/three.module.js';
import {salvageHut} from '../src/salvage-huts.js?v=12';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let selected=0;
const camera=new T.PerspectiveCamera(36,canvas.width/canvas.height,.1,120);camera.position.set(12,10,17);camera.lookAt(0,3.3,0);camera.updateMatrixWorld();camera.updateProjectionMatrix();
const light=new T.Vector3(-.5,.9,.6).normalize(),a=new T.Vector3(),b=new T.Vector3(),c=new T.Vector3(),ab=new T.Vector3(),ac=new T.Vector3(),normal=new T.Vector3(),centroid=new T.Vector3(),projected=new T.Vector3();
function draw(){
 const owned=selected===3,house=salvageHut(owned?9:8.7,owned?8:9.2,owned?0:selected,owned);house.updateMatrixWorld(true);
 ctx.fillStyle='#9cafae';ctx.fillRect(0,0,900,640);ctx.fillStyle='#788c85';ctx.beginPath();ctx.ellipse(450,537,268,40,0,0,Math.PI*2);ctx.fill();
 const faces=[];house.traverse(object=>{if(!object.isMesh)return;const geometry=object.geometry,positions=geometry.getAttribute('position'),indices=geometry.getIndex(),count=indices?indices.count:positions.count;
  for(let i=0;i<count;i+=3){const n=j=>indices?indices.getX(i+j):i+j;a.fromBufferAttribute(positions,n(0)).applyMatrix4(object.matrixWorld);b.fromBufferAttribute(positions,n(1)).applyMatrix4(object.matrixWorld);c.fromBufferAttribute(positions,n(2)).applyMatrix4(object.matrixWorld);
   ab.subVectors(b,a);ac.subVectors(c,a);normal.crossVectors(ab,ac).normalize();centroid.copy(a).add(b).add(c).multiplyScalar(1/3);if(normal.dot(projected.subVectors(camera.position,centroid))<=0)continue;
   const shade=Math.max(.45,Math.min(1.1,.63+.45*normal.dot(light))),col=object.material.color.clone().convertLinearToSRGB(),fill=`rgb(${Math.round(col.r*255*shade)},${Math.round(col.g*255*shade)},${Math.round(col.b*255*shade)})`;
   const coords=[a,b,c].map(v=>{const t=v.clone().project(camera);return [(t.x*.5+.5)*900,(-t.y*.5+.5)*640];});faces.push({coords,fill,depth:centroid.distanceToSquared(camera.position)});
  }
 });
 faces.sort((x,y)=>y.depth-x.depth);for(const f of faces){ctx.beginPath();ctx.moveTo(...f.coords[0]);ctx.lineTo(...f.coords[1]);ctx.lineTo(...f.coords[2]);ctx.closePath();ctx.fillStyle=f.fill;ctx.fill();}
}
for(const button of document.querySelectorAll('button[data-style]'))button.onclick=()=>{selected=+button.dataset.style;for(const b of document.querySelectorAll('button[data-style]'))b.setAttribute('aria-pressed',String(b===button));draw();};draw();
</script></body></html>
