<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Fringe · Drifter routines</title><style>
:root{font:15px/1.5 system-ui;color:#dae5e4;background:#192c34}body{margin:0;padding:20px;max-width:1100px;margin:auto}h1{font-size:23px;margin:0}p{color:#b7c9c8}a{color:#c4ded3}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;color:inherit;background:#30494e;border:1px solid #6c878a;padding:10px;min-height:44px}main{display:grid;grid-template-columns:1fr 320px;gap:20px}canvas{width:100%;background:#849991;border:1px solid #607c7b}.person{padding:10px 0;border-bottom:1px solid #4f6667;display:flex;gap:12px;align-items:center}.person button{width:90px;flex-shrink:0}small{display:block;color:#b5c8c5}#response{padding:14px;border-left:3px solid #93b99a;background:#263e43;min-height:60px}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><h1>The Fringe / Colony life</h1><p>A view of the game's actual schedule and route code. Residents stop at their jobs; two freight runners travel the roads. This preview uses a separate demo memory.</p><div class="controls"><label>Time speed <select id="speed"><option value="1">Real time</option><option value="10" selected>10×</option><option value="60">60×</option><option value="0">Paused</option></select></label><label>View <select id="view"><option value="town">Colony</option><option value="road">Freight roads</option></select></label><button id="listen">Pause selected Drifter</button><a href="alien-vegetation-preview.html">Alien botany</a></div><main><section><canvas id="map" width="720" height="580" aria-label="Live positions along colony and road routes"></canvas><p id="clock"></p></section><aside><div id="people"></div><p id="response">Select a Drifter to hear their observations.</p><button id="observations">Ask what they have seen</button></aside></main>
<script type="module">
import {settlement,npcsFor,roadSegments} from '../src/world.js?v=11';
import {villageObstacles} from '../src/scene-layout.js?v=25';
import {npcAt,roadPeopleFor,advanceNpcLife,meetNpc,WORLD_EPOCH,DAY_MS} from '../src/npc-life.js?v=25';
import {npcReply} from '../src/rules.js?v=25';
const s=settlement(0,0),people=[...npcsFor(s),...roadPeopleFor(0,0)],life={},canvas=document.querySelector('#map'),ctx=canvas.getContext('2d'),cards=new Map();let time=WORLD_EPOCH+280000,last=performance.now(),selected=people[0];
for(const n of people){const card=document.createElement('div');card.className='person';const button=document.createElement('button');button.textContent=n.name;button.onclick=()=>{selected=n;report();};const info=document.createElement('div');info.textContent=n.road?'Freight runner':n.role;const activity=document.createElement('small');info.append(activity);card.append(button,info);document.querySelector('#people').append(card);cards.set(n.id,{button,activity});}
function report(){const n=npcAt(selected,time,life[selected.id]);document.querySelector('#response').textContent=npcReply(n,{id:'demo',name:'Visitor'},'What have you noticed?',[],life[n.id]?.observations||[]);}
document.querySelector('#observations').onclick=report;document.querySelector('#listen').onclick=()=>{life[selected.id]=meetNpc(selected,life[selected.id]||{},time);report();};
function draw(now){const delta=Math.min(1000,now-last);last=now;time+=delta*Number(document.querySelector('#speed').value);const road=document.querySelector('#view').value==='road',span=road?1650:130,center=road?{x:s.x+470,z:s.z+470}:s,project=p=>[360+(p.x-center.x)/span*720,290+(p.z-center.z)/span*580];
 ctx.fillStyle='#849991';ctx.fillRect(0,0,720,580);ctx.strokeStyle='#b9c0a2';ctx.lineWidth=road?4:10;
 for(const [a,b]of roadSegments(0,0)){ctx.beginPath();ctx.moveTo(...project(a));ctx.lineTo(...project(b));ctx.stroke();}
 for(const o of villageObstacles(s)){const [x,y]=project(o);ctx.save();ctx.translate(x,y);ctx.rotate(-o.rotation||0);ctx.fillStyle=o.id.includes('house')?'#405863':'#6c7772';if(o.radius){ctx.beginPath();ctx.ellipse(0,0,o.radius/span*720,o.radius/span*580,0,0,Math.PI*2);ctx.fill();}else ctx.fillRect(-o.width/span*360,-o.depth/span*290,o.width/span*720,o.depth/span*580);ctx.restore();}
 for(const n of people){life[n.id]=advanceNpcLife(n,life[n.id],time);const at=npcAt(n,time,life[n.id]),[x,y]=project(at);cards.get(n.id).activity.textContent=at.activity;cards.get(n.id).button.setAttribute('aria-pressed',String(n.id===selected.id));ctx.fillStyle=n.road?'#d79f63':'#2d5860';ctx.beginPath();ctx.arc(x,y,n.id===selected.id?8:6,0,Math.PI*2);ctx.fill();if(n.id===selected.id){ctx.strokeStyle='#eee6ba';ctx.lineWidth=2;ctx.stroke();}if(x>0&&x<720&&y>0&&y<580){ctx.font='13px system-ui';ctx.fillStyle='#122f39';ctx.fillText(n.name,x+10,y-8);}}
 document.querySelector('#clock').textContent=`World day ${Math.floor((time-WORLD_EPOCH)/DAY_MS)+1} · ${Object.values(life).reduce((sum,n)=>sum+n.observations.length,0)} observations remembered in this demo`;requestAnimationFrame(draw);
}requestAnimationFrame(draw);
</script></body></html>
