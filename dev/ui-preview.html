<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>The Fringe interface preview</title>
 <link rel="stylesheet" href="../style.css?v=20"><link rel="stylesheet" href="../field-ui.css?v=22">
 <style>
  body{overflow:auto;background:#0d1d26;padding:14px;margin:0}header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}header strong{margin-right:auto;font-size:14px}header button{font-size:12px;min-height:34px;padding:6px 10px}iframe{box-sizing:content-box;display:block;width:calc(100% - 2px);height:calc(100dvh - 112px);min-height:480px;border:1px solid #44636b;margin:auto;background:#9baa92}.note{font-size:11px;color:#9fb8bd;margin:8px 0}
 </style>
</head>
<body>
 <header><strong>The Fringe · interface preview</strong><button data-view="hud">Field</button><button data-view="pack-dialog">Cargo</button><button data-view="map-dialog">Map</button><button data-view="talk-dialog">Dialogue</button><button data-view="entrance-dialog">Facilities</button><button data-view="account-dialog">Settings</button><button id="cave-view">Facility maps</button><button id="preview-weapon">Equip weapon</button><button id="preview-context">Hide interaction</button><select id="preview-npc" aria-label="Preview character"></select><select id="preview-size" aria-label="Preview screen size"><option value="desktop">Desktop</option><option value="390,700">Phone 390 × 700</option><option value="360,640">Phone 360 × 640</option><option value="320,568">Phone 320 × 568</option><option value="430,800">Phone 430 × 800</option><option value="390,350">Keyboard-sized 390 × 350</option></select></header>
 <iframe id="preview" title="Game interface preview"></iframe>
 <p class="note">UI fixtures only. This preview does not load the game or change a saved traveler.</p>
 <output id="layout-audit" class="note" aria-live="polite"></output>
 <script type="module">
  import {drawMap,drawMiniMap,drawCaveMap} from '../src/map.js?v=11';
  import {generateDungeon} from '../src/dungeons.js?v=11';
  import {createPlayer,npcGreeting,npcReply} from '../src/rules.js?v=26';
  import {npcStage,dialogueChoices} from '../src/npc-dialogue.js?v=26';
  import {settlement,npcsFor} from '../src/world.js?v=11';
  import {shipVisitor,portBroker} from '../src/landing-port.js?v=25';
  import {roadPeopleFor} from '../src/npc-life.js?v=25';
  import {ROLE_TITLES} from '../src/fringe-lore.js?v=25';
  import {installUILayout} from '../src/ui-layout.js?v=4';
  const frame=document.getElementById('preview'),source=await(await fetch('../index.html?v=26')).text(),doc=new DOMParser().parseFromString(source,'text/html');
  doc.querySelectorAll('script').forEach(e=>e.remove());const base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);
  doc.getElementById('loading').hidden=true;doc.getElementById('save-status').textContent='Saved on this device';doc.getElementById('location').textContent='Willowhaven';doc.getElementById('nearby-tip').textContent='Mara · village keeper';doc.getElementById('interact-button').disabled=false;doc.querySelector('.interaction').hidden=false;doc.getElementById('location').textContent='Earlie Reach · Spindle Anchorage';doc.getElementById('interact-button').innerHTML='Talk to Mara <kbd>E</kbd>';
  doc.getElementById('connection-notice').hidden=true;const stage=doc.createElement('style');stage.textContent='#scene{background:linear-gradient(155deg,#729c8e,#486b61 45%,#2d514e)}#scene::before{content:"";position:absolute;inset:24% 0 0;clip-path:polygon(0 25%,15% 15%,30% 30%,55% 0,85% 20%,100% 8%,100% 100%,0 100%);background:#557b6b}';doc.head.append(stage);
  frame.srcdoc=doc.documentElement.outerHTML;await new Promise(resolve=>frame.onload=resolve);const ui=frame.contentDocument,p=createPlayer('ui-preview','Ada');installUILayout(ui,frame.contentWindow);
  function audit(){
   const win=frame.contentWindow,w=win.innerWidth,h=win.innerHeight,issues=[];
   const visibleRect=e=>{const r=e.getBoundingClientRect();let left=r.left,right=r.right,top=r.top,bottom=r.bottom;for(let a=e.parentElement;a;a=a.parentElement){const s=win.getComputedStyle(a),b=a.getBoundingClientRect();if(/auto|hidden|scroll|clip/.test(s.overflowX)){left=Math.max(left,b.left);right=Math.min(right,b.right);}if(/auto|hidden|scroll|clip/.test(s.overflowY)){top=Math.max(top,b.top);bottom=Math.min(bottom,b.bottom);}}return {left,right,top,bottom,width:Math.max(0,right-left),height:Math.max(0,bottom-top)};};
   const controls=[...ui.querySelectorAll('button,summary,input:not([type=file]),textarea,.button')].filter(e=>{if(e.closest('details:not([open])')&&e.tagName!=='SUMMARY')return false;const r=visibleRect(e),s=win.getComputedStyle(e);return r.width&&r.height&&s.visibility!=='hidden'&&s.display!=='none'&&r.top<h&&r.bottom>0;});
   const name=e=>e.id||e.textContent.trim().slice(0,30);
   for(const e of controls){const r=e.getBoundingClientRect();if(w<=760&&(r.height<43.9||r.width<43.9))issues.push('Small target: '+name(e));if(r.left<-.5||r.right>w+.5)issues.push('Outside screen: '+name(e));}
   for(let i=0;i<controls.length;i++)for(let j=i+1;j<controls.length;j++){const a=controls[i],b=controls[j],ar=visibleRect(a),br=visibleRect(b);if(a.contains(b)||b.contains(a))continue;if(Math.min(ar.right,br.right)-Math.max(ar.left,br.left)>.5&&Math.min(ar.bottom,br.bottom)-Math.max(ar.top,br.top)>.5)issues.push('Intersecting: '+name(a)+' / '+name(b));}
   if(w<=760)for(const group of ui.querySelectorAll('.top-actions,.quick-items,.action-controls,.forge-grid,.dialogue-choices,.dialogue-footer,.inline-form,.map-tools')){const targets=controls.filter(e=>group.contains(e));for(let i=0;i<targets.length;i++)for(let j=i+1;j<targets.length;j++){const a=visibleRect(targets[i]),b=visibleRect(targets[j]),dx=Math.max(0,a.left-b.right,b.left-a.right),dy=Math.max(0,a.top-b.bottom,b.top-a.bottom);if(Math.hypot(dx,dy)<7.9)issues.push('Tight spacing: '+name(targets[i])+' / '+name(targets[j]));}}
   if(ui.documentElement.scrollWidth>w)issues.push('Horizontal overflow');document.getElementById('layout-audit').textContent=w+' × '+h+' · '+(issues.length?issues.join(' · '):'PASS: no overlapping controls; mobile targets ≥44px and gaps ≥8px.');
  }
  const queueAudit=()=>requestAnimationFrame(()=>requestAnimationFrame(audit));
  const show=id=>{ui.querySelectorAll('dialog[open]').forEach(d=>d.close());if(id!=='hud'){ui.getElementById(id).showModal();ui.getElementById(id).querySelector('.terminal-body').scrollTop=0;}queueAudit();};
  ui.getElementById('account-name').textContent=p.name;ui.getElementById('rename-input').value=p.name;ui.getElementById('storage-explanation').textContent='Your home, supplies, and memories are saved on this device.';ui.getElementById('home-description').textContent='Your landing pod in Spindle Anchorage. You return to its doorstep each session.';
  const colony=settlement(0,0),characters=[...npcsFor(colony),...roadPeopleFor(0,0),shipVisitor(colony),portBroker(colony)],previewMemories=new Map();let character=characters[0];
  const characterSelect=document.getElementById('preview-npc');for(const n of characters){const option=document.createElement('option');option.value=n.id;option.textContent=`${n.name} · ${n.broker?'Port broker':ROLE_TITLES[n.role]}`;characterSelect.append(option);}
  function line(text){const bubble=ui.createElement('div');bubble.className='bubble';bubble.textContent=text;ui.getElementById('conversation').replaceChildren(bubble);queueAudit();}
  function selectCharacter(n){character={...n,activity:n.visitor?'buying nutrient pods and fuel cells':n.broker?'checking landing manifests':'taking a break from work'};ui.getElementById('npc-name').textContent=n.name;ui.getElementById('npc-avatar').textContent=n.name[0];ui.getElementById('npc-role').textContent=`${n.broker?'Port broker':ROLE_TITLES[n.role]} · ${n.affiliation||'Independent Drifters'}`;ui.getElementById('npc-stage').textContent=npcStage(n);ui.getElementById('nearby-tip').textContent=`${n.name} · ${ROLE_TITLES[n.role]}`;ui.getElementById('interact-button').textContent=`Talk to ${n.name}`;
   for(const [i,b]of [...ui.getElementById('dialogue-choices').children].entries()){const choice=dialogueChoices(n)[i];b.textContent=choice.label;b.dataset.line=choice.line;b.onclick=()=>answer(b.dataset.line);}
   ui.getElementById('custom-reply').open=false;line(npcGreeting(character,p,(previewMemories.get(n.id)||[]).length>0));}
  function answer(message){if(!message.trim())return;const memories=previewMemories.get(character.id)||[],response=npcReply(character,p,message,memories);memories.unshift({playerId:p.id,playerName:p.name,message,response});previewMemories.set(character.id,memories);line(response);ui.getElementById('chat-input').value='';ui.getElementById('custom-reply').open=false;ui.getElementById('talk-dialog').querySelector('.terminal-body').scrollTop=0;}
  characterSelect.onchange=()=>{selectCharacter(characters.find(n=>n.id===characterSelect.value));show('talk-dialog');};selectCharacter(character);
  ui.getElementById('history-button').onclick=()=>{ui.getElementById('history-title').textContent=`Conversations with ${character.name}`;ui.getElementById('history-content').replaceChildren(...(previewMemories.get(character.id)||[]).slice().reverse().map(m=>{const div=ui.createElement('div');div.className='bubble';div.textContent=`${m.playerName}: ${m.message} — ${character.name}: ${m.response}`;return div;}));show('history-dialog');};
  ui.getElementById('entrance-title').textContent='Spindle Freight Bunker';ui.getElementById('entrance-description').textContent='Your scanner detects power below the sealed access lock. Will you enter?';ui.getElementById('entrance-stats').innerHTML='<div><b>Exploration</b><span>Never entered</span></div><div><b>Supplies</b><span>38 deposits remain</span></div>';
  ui.getElementById('inventory').innerHTML='<div><span class="item-icon">▥</span><span>Biomass</span><b>12</b></div><div><span class="item-icon">◆</span><span>Silicate</span><b>8</b></div><div><span class="item-icon">●</span><span>Nutrient pods</span><b>3</b></div><div><span class="item-icon">≋</span><span>Biofilament</span><b>6</b></div>';
  ui.getElementById('journey-summary').textContent='2 colonies visited · 1 facility entered · 1.24 km walked';ui.getElementById('journal').innerHTML='<div class="journal-entry">Recovered 4 biomass<small>11:20</small></div><div class="journal-entry">Returned to Spindle Freight Bunker<small>11:18</small></div>';
  ui.getElementById('stamina').value=72;ui.getElementById('stamina-display').hidden=false;ui.getElementById('jump-button').disabled=false;ui.getElementById('health').value=84;ui.getElementById('food').value=62;ui.getElementById('water').value=72;drawMiniMap(ui.getElementById('minimap'),p);drawMap(ui.getElementById('atlas'),p,2600,p,{detailed:true,home:p.house});ui.getElementById('map-scale').textContent='2.6 km across';
  for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>show(button.dataset.view);
  for(const [button,dialog]of [['pack-button','pack-dialog'],['map-button','map-dialog'],['account-button','account-dialog'],['interact-button','talk-dialog']])ui.getElementById(button).onclick=()=>show(dialog);
  ui.getElementById('stay-button').onclick=()=>show('hud');ui.getElementById('enter-button').onclick=()=>show('hud');ui.getElementById('chat-form').onsubmit=e=>{e.preventDefault();answer(ui.getElementById('chat-input').value);};ui.getElementById('custom-reply').addEventListener('toggle',queueAudit);ui.addEventListener('close',queueAudit,true);
  const dungeon=generateDungeon(1,2),underground={...p,dungeon:{id:dungeon.id,...dungeon.spawn},caves:{[dungeon.id]:{rooms:[0]}}};document.getElementById('cave-view').onclick=()=>{drawMiniMap(ui.getElementById('minimap'),underground,{cave:dungeon});drawCaveMap(ui.getElementById('atlas'),dungeon,underground,{detailed:true});ui.getElementById('map-caption').textContent='Faint rooms are unexplored. Gold dots are supplies; teal marks the access lock.';ui.getElementById('map-scale').textContent='Facility layout';show('map-dialog');};
  document.getElementById('preview-size').onchange=e=>{const size=e.target.value.split(',');frame.style.width=size.length===2?size[0]+'px':'calc(100% - 2px)';frame.style.height=size.length===2?size[1]+'px':'calc(100dvh - 112px)';frame.style.minHeight='0';frame.style.maxWidth='calc(100% - 2px)';queueAudit();};
  document.getElementById('preview-weapon').onclick=e=>{const armed=ui.getElementById('attack-button').hidden;ui.getElementById('attack-button').hidden=!armed;ui.getElementById('attack-button').disabled=false;ui.getElementById('held-weapon').hidden=!armed;ui.getElementById('held-weapon').textContent=armed?'Salvage cutter':'';e.target.textContent=armed?'Put weapon away':'Equip weapon';queueAudit();};document.getElementById('preview-context').onclick=e=>{const group=ui.querySelector('.interaction');group.hidden=!group.hidden;e.target.textContent=group.hidden?'Show interaction':'Hide interaction';queueAudit();};ui.addEventListener('scroll',queueAudit,true);window.addEventListener('resize',queueAudit);queueAudit();
 </script>
</body>
</html>
