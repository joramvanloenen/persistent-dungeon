<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Fringe · UI playtest</title><link rel="stylesheet" href="../style.css?v=11"><style>body{overflow:auto;padding:12px;background:var(--field)}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}header strong{margin-right:auto}header button,select{min-height:44px}iframe{display:block;width:980px;max-width:100%;height:780px;box-sizing:content-box;border:1px solid var(--line);margin:auto}body>p,output{display:block;font-size:12px}</style></head><body>
<header><strong>The Fringe · disposable UI playtest</strong><button id="transit">Planet transit</button><button id="lore">Field guide</button><button id="dialogue">Drifter dialogue</button><button id="fabricator">Fabrication bay</button><button id="advance">Advance heat by 7 seconds</button><select id="size" aria-label="Preview width"><option value="980,780">Desktop</option><option value="390,700">Phone 390</option><option value="320,568">Phone 320</option></select></header>
<iframe id="fringe-preview" title="The Fringe interface preview"></iframe><p>Real transit, fabrication, and NPC recall rules with an in-memory Drifter. This fixture does not load WebGL or write a save.</p><output id="result" aria-live="polite"></output><output id="audit" aria-live="polite"></output>
<script type="module">
import {createPlayer,validateAction,npcGreeting} from '../src/rules.js?v=24';
import {landingColony,resolvePlanet} from '../src/planets.js?v=11';
import {npcsFor,smithFor,settlement} from '../src/world.js?v=11';
import {installForgeUI} from '../src/forge-ui.js?v=11';
import {installFringeUI} from '../src/fringe-ui.js?v=11';
import {installUILayout} from '../src/ui-layout.js?v=4';
const frame=document.getElementById('fringe-preview'),source=await(await fetch('../index.html?v=11')).text(),doc=new DOMParser().parseFromString(source,'text/html');doc.querySelectorAll('script').forEach(e=>e.remove());const base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);doc.getElementById('loading').hidden=true;doc.getElementById('scene').style.background='#314b58';frame.srcdoc=doc.documentElement.outerHTML;await new Promise(resolve=>frame.onload=resolve);
const ui=frame.contentDocument,$=id=>ui.getElementById(id);let p=createPlayer('fringe-ui-fixture','Ada'),skip=0,activeNpc,memories=[];p.coins=40;p.inventory.iron=20;p.inventory.wood=20;p.inventory.stone=20;p.inventory.powerballs=2;
const clock=()=>Date.now()+skip;
const audit=()=>{const phone=frame.clientWidth<=760,controls=[...ui.querySelectorAll('dialog[open] button,dialog[open] select,dialog[open] summary')].filter(e=>e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden').map(e=>({name:e.textContent.trim().slice(0,30),r:e.getBoundingClientRect()})),issues=[];for(const c of controls)if(phone&&(c.r.width<43.5||c.r.height<43.5))issues.push('Small: '+c.name);for(let i=0;i<controls.length;i++)for(let j=i+1;j<controls.length;j++){const a=controls[i],b=controls[j];if(Math.min(a.r.right,b.r.right)-Math.max(a.r.left,b.r.left)>1&&Math.min(a.r.bottom,b.r.bottom)-Math.max(a.r.top,b.r.top)>1)issues.push('Overlap: '+a.name+' / '+b.name);}document.getElementById('audit').textContent=issues.length?issues.join(' · '):'Control audit: no overlaps'+(phone?' · all touch targets at least 44 px':'');};
const openDialog=id=>{ui.querySelectorAll('dialog[open]').forEach(d=>d.close());$(id).showModal();requestAnimationFrame(audit);};
installUILayout(ui,frame.contentWindow);
const state=()=>{const planet=resolvePlanet(p.planet);$('location').textContent=planet.name;$('coin-balance').textContent=p.coins+' credits';$('account-name').textContent=p.name;$('held-weapon').textContent=p.weapons.find(w=>w.id===p.equipped)?.name||'No weapon';};state();
const act=async action=>{const r=validateAction(p,action,{now:clock(),memories:memories.filter(m=>m.npc===action.target)});p=r.player;if(action.type==='talk')memories.push({npc:action.target,playerId:p.id,playerName:p.name,message:r.extra.message,response:r.extra.response});document.getElementById('result').textContent=r.summary+' · '+p.coins+' credits · '+p.inventory.powerballs+' Powerballs';state();requestAnimationFrame(audit);return r;};
const fringe=installFringeUI({doc:ui,getPlayer:()=>p,act,openDialog,onLanded:planet=>{$('landing-title').textContent=planet.name;$('landing-report').textContent=planet.type+'. A Drifter colony has accepted your arrival manifest. Cargo intact.';openDialog('landing-dialog');}});
const speak=async message=>{if(!message)return;const r=await act({type:'talk',target:activeNpc.id,message}),bubble=ui.createElement('div');bubble.className='bubble';bubble.textContent=r.extra.response;$('conversation').replaceChildren(bubble);$('chat-input').value='';$('custom-reply').open=false;};
const talk=npc=>{activeNpc=npc;p.x=npc.x;p.z=npc.z;$('npc-name').textContent=npc.name;$('npc-avatar').textContent=npc.name[0];$('npc-role').textContent='Colony steward · '+npc.affiliation;$('npc-stage').textContent=npc.name+' turns down the colony comms, listening.';const bubble=ui.createElement('div');bubble.className='bubble';bubble.textContent=npcGreeting(npc,p,memories.some(m=>m.npc===npc.id));$('conversation').replaceChildren(bubble);openDialog('talk-dialog');};
const forge=installForgeUI({doc:ui,getPlayer:()=>p,clock,act,openDialog,onTalk:talk});
document.getElementById('transit').onclick=()=>{if(!p.forge){const c=landingColony(resolvePlanet(p.planet));p.x=c.x+9;p.z=c.z+15;}fringe.transit();};
document.getElementById('lore').onclick=()=>openDialog('lore-dialog');
document.getElementById('dialogue').onclick=()=>talk(npcsFor(landingColony(resolvePlanet(p.planet)))[1]);
document.getElementById('fabricator').onclick=()=>{const planet=resolvePlanet(p.planet);let smith;for(let x=planet.gx*16-4;x<planet.gx*16+4&&!smith;x++)smith=smithFor(settlement(x,planet.gz*16));p.x=smith.x;p.z=smith.z;forge.open(smith);requestAnimationFrame(audit);};
document.getElementById('advance').onclick=()=>{skip=p.forge?.phase==='heat'?p.forge.startedAt+7000-Date.now():skip+7000;forge.refresh();};
document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';requestAnimationFrame(audit);};
for(const b of $('dialogue-choices').children)b.onclick=()=>speak(b.dataset.line);$('chat-form').onsubmit=e=>{e.preventDefault();speak($('chat-input').value.trim());};$('history-button').onclick=()=>{$('history-title').textContent=activeNpc.name+' · Conversation journal';$('history-content').replaceChildren();for(const m of memories.filter(m=>m.npc===activeNpc.id)){const line=ui.createElement('p');line.textContent=m.message+' — '+m.response;$('history-content').append(line);}openDialog('history-dialog');};
ui.addEventListener('scroll',audit,true);ui.addEventListener('toggle',()=>requestAnimationFrame(audit),true);document.getElementById('transit').click();
</script></body></html>
