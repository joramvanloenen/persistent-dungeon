<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Fringe · Alien vegetation</title><style>
:root{font:15px/1.4 system-ui,Arial,sans-serif;color:#dce7e7;background:#172c35}body{margin:0;padding:18px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}h1{font-size:19px;margin:0 20px 0 0}button{font:inherit;border:1px solid #799199;background:#344c57;color:inherit;padding:10px 16px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#bd9862;color:#172c35}.frame{max-width:1000px;margin:auto;border:1px solid #688087;background:#8fa7a3}canvas{display:block;width:100%}.caption{max-width:1000px;margin:8px auto;font-size:13px;color:#b7caca}
</style></head><body><header><h1>Procedural alien growth</h1><button data-biome="forest" aria-pressed="true">Canopy belt</button><button data-biome="marsh">Algal wetland</button><button data-biome="desert">Red dust flat</button><button data-biome="tundra">Frost plain</button></header><div class="frame"><canvas width="1000" height="650" aria-label="Three procedural branching alien plants with hanging lianes, knobs, and seed pods"></canvas></div><p class="caption">Development preview projected from the same generated mesh geometry used in the world. This view does not use WebGL.</p>
<script type="module">
import * as T from '../vendor/three.module.js';
import {alienPlantGeometry} from '../src/alien-vegetation.js?v=14';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),tints={forest:0xb2d0b9,marsh:0x9dd1c2,desert:0xd8b69e,tundra:0xc6d0d5};let biome='forest';
const camera=new T.PerspectiveCamera(42,1000/650,.1,120);camera.position.set(20,13,29);camera.lookAt(0,5.6,0);camera.updateMatrixWorld();camera.updateProjectionMatrix();
const light=new T.Vector3(-.4,.85,.7).normalize(),a=new T.Vector3(),b=new T.Vector3(),c=new T.Vector3(),ab=new T.Vector3(),ac=new T.Vector3(),normal=new T.Vector3(),centroid=new T.Vector3();
function draw(){ctx.fillStyle='#94aaa7';ctx.fillRect(0,0,1000,650);ctx.fillStyle='#748f86';ctx.beginPath();ctx.ellipse(500,570,400,42,0,0,Math.PI*2);ctx.fill();
 const faces=[],tint=new T.Color(tints[biome]);for(let style=0;style<3;style++){
  const geo=alienPlantGeometry(style),points=geo.getAttribute('position'),colors=geo.getAttribute('color'),position=new T.Vector3((style-1)*8.7,0,style===1?-2:0);
  for(let i=0;i<points.count;i+=3){a.fromBufferAttribute(points,i).add(position);b.fromBufferAttribute(points,i+1).add(position);c.fromBufferAttribute(points,i+2).add(position);ab.subVectors(b,a);ac.subVectors(c,a);normal.crossVectors(ab,ac).normalize();centroid.copy(a).add(b).add(c).multiplyScalar(1/3);
   const shade=Math.max(.5,Math.min(1.15,.7+.42*Math.abs(normal.dot(light)))),col=new T.Color(colors.getX(i),colors.getY(i),colors.getZ(i)).multiply(tint).convertLinearToSRGB(),fill=`rgb(${Math.round(col.r*255*shade)},${Math.round(col.g*255*shade)},${Math.round(col.b*255*shade)})`;
   const coords=[a,b,c].map(v=>{const t=v.clone().project(camera);return [(t.x*.5+.5)*1000,(-t.y*.5+.5)*650];});faces.push({coords,fill,depth:centroid.distanceToSquared(camera.position)});
  }
 }
 faces.sort((x,y)=>y.depth-x.depth);for(const f of faces){ctx.beginPath();ctx.moveTo(...f.coords[0]);ctx.lineTo(...f.coords[1]);ctx.lineTo(...f.coords[2]);ctx.closePath();ctx.fillStyle=f.fill;ctx.fill();}
}
for(const button of document.querySelectorAll('button[data-biome]'))button.onclick=()=>{biome=button.dataset.biome;for(const b of document.querySelectorAll('button[data-biome]'))b.setAttribute('aria-pressed',String(b===button));draw();};draw();
</script></body></html>
